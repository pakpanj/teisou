name: kana_master
description: "Teisou: Kana Master - belajar Hiragana & Katakana untuk pemula."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.5
  google_sign_in: ^6.2.2
  # Push notifications for chat/clan messages — the server-side half
  # lives in functions/index.js (Cloud Functions), triggered whenever a
  # message is written. flutter_local_notifications is only needed to
  # show a banner while the app is in the *foreground* (Android
  # auto-displays FCM notifications on its own otherwise).
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Avatar upload: pick from gallery (built-in resize/compress via
  # maxWidth/maxHeight/imageQuality — no separate compression package)

  # Text-to-speech untuk pengucapan kana & contoh kata
  flutter_tts: ^4.2.0

  # Render aset karakter kana berbentuk SVG
  flutter_svg: ^2.0.16
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  confetti: ^0.8.0

  # Cam Detector: live camera preview + offline Japanese OCR
  camera: ^0.12.0+1
  google_mlkit_text_recognition: ^0.16.0
  permission_handler: ^12.0.3

  # Local storage untuk Daftar Belajar (saved words) sebelum sync ke Firestore
  shared_preferences: ^2.5.5

  # Modul Kotoba: gambar ilustrasi on-demand dari Firebase Storage, cache
  # lokal permanen (flutter_cache_manager custom Config) supaya cuma
  # download sekali per kata
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # StrokeOrderAnimator (Batch 7): parses KanjiVG SVG stroke paths — was
  # already a transitive dep via flutter_svg's vector_graphics pipeline,
  # promoted to direct since we call its API ourselves now.
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# path_provider_android pulls in package:jni transitively. jni 1.0.1's
# android/build.gradle unconditionally calls `kotlin { compilerOptions {...} }`
# but only applies the kotlin-android plugin when AGP major version < 9
# (assuming AGP 9+ registers the `kotlin` extension itself) — with this
# project's AGP 9.0.1, that assumption doesn't hold, so the `kotlin`
# extension is never registered and the build fails with "Could not find
# method kotlin() ... on project ':jni'". Fixed upstream in jni 1.0.2
# ("Revert an unnecessary (and breaking) KGP migration"). Remove this
# override once path_provider_android's own pubspec bumps its jni
# constraint past 1.0.1 and `flutter pub get` picks up >=1.0.2 on its own.
dependency_overrides:
  jni: ^1.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/data/kana_data.json
    - assets/data/bab_data.json
    - assets/data/kanji_data.json
    - assets/data/kanji/
    - assets/data/kotoba_data.json
    - assets/data/kotoba/
    - assets/data/bunpou_data.json
    - assets/data/bunpou/
    - assets/data/particle_data.json
    - assets/data/particle/
    - assets/data/kaiwa_data.json
    - assets/data/kaiwa/
    - assets/data/dokkai_data.json
    - assets/data/dokkai/
    - assets/data/choukai_data.json
    - assets/data/choukai/
    - assets/data/dictionary_data.json
    - assets/svg/hiragana/
    - assets/svg/katakana/
    - assets/kanjivg/
    - assets/images/
    - assets/avatars/
    - assets/covers/
    - assets/frames/
    - assets/mascot/
    - assets/icons/
    - assets/clan_icons/
    - assets/leaderboard/
    - assets/banners/
    - assets/module_frames/
